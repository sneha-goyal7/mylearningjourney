<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-box">
    <h2>Student Registration Form</h2>
    <p class="form-intro">Fill in the details below to get started.</p>

    <form action="#" method="post">

      <div class="form-group">
        <label for="name" class="label-name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Sneha Goyal" required>
      </div>

      <div class="form-group">
        <label for="father" class="label-father">Father's name</label>
        <input type="text" id="father" name="father" placeholder="Father's full name" required>
      </div>

      <div class="form-group">
        <label for="email" class="label-email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="phone" class="label-phone">Phone number</label>
        <input type="tel" id="phone" name="phone" placeholder="9876543210" pattern="[0-9]{10}" required>
      </div>

      <div class="form-group">
        <label for="dob" class="label-dob">Date of birth</label>
        <input type="date" id="dob" name="dob" required>
      </div>

      <fieldset class="form-group">
        <legend class="label-gender">Gender</legend>
        <div class="radio-row">
          <label class="radio-label"><input type="radio" name="gender" value="female" required> Female</label>
          <label class="radio-label"><input type="radio" name="gender" value="male"> Male</label>
          <label class="radio-label"><input type="radio" name="gender" value="other"> Other</label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="course" class="label-course">Course</label>
        <select id="course" name="course" required>
          <option value="">Select a course</option>
          <option value="btech-cse">B.Tech CSE</option>
          <option value="btech-it">B.Tech IT</option>
          <option value="bca">BCA</option>
          <option value="mca">MCA</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password" class="label-password">Password</label>
        <input type="password" id="password" name="password" placeholder="Minimum 8 characters" minlength="8" required>
      </div>

      <label class="checkbox-label">
        <input type="checkbox" id="terms" name="terms" required>
        I agree to the terms and conditions
      </label>

      <button type="submit">Register</button>

    </form>
  </div>

</body>
</html>
