<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertion</title>
    <style>
        .red{
            color: red;
        }
        .box{
            display:flex;
        }
    </style>
</head>

<body>
    <div class="container red bg-green">
        <div class="box" data-createdby="sneha" data-conceptby="goyal" >Hey I am a box</div>
        <div class="box">Hey I am a box</div>
        <script>
            let div = document.createElement("div");
            div.innerHTML = "I have been inserted <b>by sneha</b>"
            div.setAttribute("class", "created");
            document.querySelector(".container").before(div);
            let cont = document.querySelector(".container")
            cont.insertAdjacentHTML("beforebegin", "<b> I am under the water. Please help me here too much raining.... ooouuuuucchhhhhhhhhhhhhhhh.........</b>")
        </script>
    </div>
</body>

</html>
